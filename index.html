<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZMH Modding Hub</title>
<style>
:root{--acc:#22c55e;--blue:var(--acc);--green:#22c55e;--purple:#a855f7;--discord:#5865f2;--text:#fff;--mut:#8a8a8a;--bg:color-mix(in srgb,var(--acc) 6%,#000);--panel:color-mix(in srgb,var(--acc) 10%,#000);--hb:color-mix(in srgb,var(--acc) 12%,#000);--line:color-mix(in srgb,var(--acc) 24%,#0a0a0a);--g1:color-mix(in srgb,var(--acc) 55%,#fff);--g2:color-mix(in srgb,var(--acc) 70%,#000)}
*{box-sizing:border-box;cursor:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif}
a,button{font-family:inherit}
header{background:var(--hb);display:flex;justify-content:space-between;align-items:center;padding:24px 44px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.logo{font-size:2rem;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;font-family:"Trebuchet MS",sans-serif}
nav{display:flex;gap:12px;align-items:center;position:relative;flex-wrap:wrap}
.btn,.pill{background:var(--hb);color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 22px;font-weight:700;font-size:1rem;transition:.15s}
.pill{border-radius:99px;padding:7px 14px;font-weight:400;font-size:.95rem;display:flex;align-items:center;gap:8px}
.btn:hover{border-color:#444}
.btn.active{color:var(--blue);border-color:#fff;box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 35%,#000)}
.btn.active.unity{border-color:var(--blue);box-shadow:none}
.av{width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.menu{position:absolute;right:0;top:100%;margin-top:8px;width:230px;background:var(--hb);border:1px solid var(--line);border-radius:14px;padding:8px;display:none;z-index:50}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:6px 0;font-weight:700;font-size:1rem}
main{max-width:1500px;margin:0 auto;padding:46px 72px;min-height:520px}
h1{margin:0 0 20px;font-size:2.1rem;padding-left:18px;border-left:4px solid var(--blue);line-height:1.1}
.apk h1{border-color:var(--green)}.unity-p h1{border-color:var(--purple)}
.lead{color:var(--mut);font-size:1.35rem;line-height:1.85;max-width:1050px}
.card-box{margin-top:60px;border:1px solid var(--line);border-radius:26px;padding:50px 20px;text-align:center}
.card-box h2{margin:0 0 14px;font-size:1.7rem}.card-box p{color:#bbb;margin:0 0 20px}
.dbtn{background:var(--discord);color:#fff;border:0;border-radius:10px;padding:16px 38px;font-size:1.3rem;font-weight:700;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.layout{display:flex;gap:38px;margin-top:30px}
.side{width:272px;flex:none;border-right:1px solid var(--line);padding-right:28px;display:flex;flex-direction:column;gap:10px}
.tab{background:var(--hb);border:1px solid var(--line);border-radius:10px;padding:16px 20px;color:#bbb;font-weight:700;font-size:1.05rem;text-align:left}
.apk .tab.on{color:var(--green);border-color:var(--green);background:#04120a}
.unity-p .tab.on{color:var(--purple);border-color:var(--purple);background:#10051c}
.content{flex:1;min-width:0}
.bar{display:flex;gap:16px;align-items:center}
.bar input,.bar select,.f input,.f select,.f textarea{background:var(--panel);border:1px solid var(--line);border-radius:12px;color:#fff;padding:18px;font-size:1.05rem;font-family:inherit;outline:none}
.bar input{flex:1}.bar select{padding:18px 14px}
.count{color:var(--mut);font-size:.95rem;white-space:nowrap}
.empty{margin-top:30px;border:1px dashed var(--line);border-radius:18px;padding:55px;text-align:center;color:#555;font-style:italic;font-size:1.3rem}
.grid{margin-top:30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,320px));gap:22px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.15s}
.item:hover{border-color:#444;transform:translateY(-2px)}
.thumb{height:210px;background:#000;display:grid;place-items:center;color:#333;font-size:3rem}
.thumb img{width:100%;height:100%;object-fit:contain}
.item .t{padding:16px 18px;background:var(--panel);font-size:1.05rem}
footer{border-top:1px solid var(--line);text-align:center;color:#555;padding:48px}
.splash{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;transition:opacity .6s}
.splash h1{border:0;padding:0;font-size:3.4rem;font-weight:800;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.splash p{color:var(--mut);font-size:1.3rem}.splash b{color:var(--acc);letter-spacing:1px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;place-items:center;padding:20px}
.ov.open{display:grid}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:42px 40px;width:min(720px,100%);text-align:center;max-height:92vh;overflow:auto}
.modal h3{margin:0 0 14px;font-size:1.7rem}.modal p{color:#bbb}
.modal input,.modal select,.modal textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:#fff;padding:17px;font-size:1.05rem;margin:8px 0;font-family:inherit}
.mbtn{width:100%;border:0;border-radius:10px;padding:18px;font-size:1.15rem;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--g1),var(--g2));margin-top:10px}
.mbtn.alt{background:var(--line)}
.or{color:#666;margin:18px 0 6px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#111;border:1px solid #333;border-radius:12px;padding:12px 22px;z-index:300;display:none}
#cur{position:fixed;left:0;top:0;width:60px;height:60px;border-radius:50%;pointer-events:none;z-index:9999;margin:-30px 0 0 -30px;
background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55) 0,color-mix(in srgb,var(--acc) 40%,transparent) 14%,color-mix(in srgb,var(--acc) 24%,transparent) 60%,color-mix(in srgb,var(--acc) 12%,transparent) 100%);border:2px solid color-mix(in srgb,var(--acc) 70%,transparent);box-shadow:0 0 24px color-mix(in srgb,var(--acc) 50%,transparent);transition:transform .12s;transform:scale(.5)}
#cur.big{transform:scale(.62)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,46px);gap:10px;max-width:720px}
.swb{width:46px;height:46px;border-radius:12px;border:2px solid #333}
.swb.on{border-color:#fff;box-shadow:0 0 0 2px var(--blue)}
.urow{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0;max-width:700px;color:#ddd}
.urow a{color:#ff6b6b;text-decoration:none}
.mrow{display:flex;gap:12px;align-items:flex-start;margin:6px 0}
.mrow span{color:#666;width:70px;flex:none;text-align:right;padding-top:10px}
.mrow textarea{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:#fff;padding:10px;font-family:Consolas,monospace;font-size:.95rem;resize:none;overflow:hidden;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;min-height:42px}
.mrow textarea.ch{border-color:var(--green)}
.btn:disabled{opacity:.4}
body{background:radial-gradient(ellipse 80% 55% at 12% -8%,color-mix(in srgb,var(--acc) 24%,transparent),transparent 60%),radial-gradient(ellipse 60% 45% at 100% 100%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
h1,h2,h3,.logo{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1,.apk h1,.unity-p h1{border-color:var(--acc)}
.tab.on,.apk .tab.on,.unity-p .tab.on{color:var(--acc);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,#000)}
.item:hover,.btn:hover{border-color:var(--acc)}
#cur.img{background:center/contain no-repeat;border:0;box-shadow:none;border-radius:0;transform:none}
#cur.img.big{transform:scale(.88)}
.arow{display:grid;grid-template-columns:2fr 1.2fr 1.4fr .9fr 2.6fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0;background:var(--panel);font-size:.95rem;overflow-wrap:anywhere}
.arow.ch{border-color:var(--green)}
.sm{padding:6px 12px!important;font-size:.85rem!important}
@media(max-width:800px){.arow{grid-template-columns:1fr}}
.hide{display:none!important}
@media(max-width:800px){header{padding:16px}main{padding:28px 16px}.layout{flex-direction:column}.side{width:auto;border:0;padding:0;flex-direction:row;flex-wrap:wrap}.splash h1{font-size:2rem}.logo{font-size:1.4rem}.btn{padding:9px 12px;font-size:.9rem}*{cursor:auto!important}#cur{display:none}}
</style>
</head>
<body>

<div class="splash" id="splash">
  <h1>Welcome to ZMH Modding Hub</h1>
  <p>Thanks for stopping by! The site will be ready in just a moment.</p>
  <b id="wait">Please wait 2s...</b>
</div>

<header>
  <div class="logo">ZMH Modding Hub</div>
  <nav>
    <button class="pill" id="who">Not signed in</button>
    <button class="btn" data-page="home">Home</button>
    <button class="btn" data-page="apk">Modding Tools</button>
    <button class="btn unity" data-page="unity">More Tools</button>
    <button class="btn" data-page="meta">Metadata Editor</button>
    <button class="btn" data-page="uabe">UABEA Editor</button>
    <button class="btn" data-page="settings">Settings</button>
    <button class="btn" id="burger" aria-label="Menu" style="padding:12px 16px;font-size:1.3rem">☰</button>
    <div class="menu" id="menu">
      <button style="color:#ff6fb5" data-act="booster">Get Booster Code</button>
      <button style="color:#d6b13a" data-act="staff">Get Staff Code</button>
      <button style="color:#4aa3ff" data-act="rename">Change Username</button>
      <button style="color:#ff6b6b" data-act="logout">Log Out</button>
    </div>
  </nav>
</header>

<main id="app"></main>
<footer>© ZMH Modding Hub</footer>

<!-- Sign in -->
<div class="ov" id="signin"><div class="modal">
  <h3>Sign In</h3>
  <p>Sign in with Discord to unlock staff / booster access automatically.</p>
  <button class="dbtn" id="discordLogin" style="width:auto">🎮 Login with Discord</button>
  <div class="or">— or —</div>
  <input id="uname" placeholder="Pick a username" maxlength="20" style="width:60%;display:block;margin:8px 0">
  <button class="mbtn" id="cont">Continue without Discord</button>
</div></div>

<!-- Code entry -->
<div class="ov" id="codeov"><div class="modal">
  <h3 id="codeTitle">Enter code</h3>
  <p id="codeHelp"></p>
  <input id="codeIn" placeholder="Enter code">
  <button class="mbtn" id="codeOk">Unlock</button>
  <button class="mbtn alt" data-close>Cancel</button>
</div></div>

<!-- Add item -->
<div class="ov" id="addov"><div class="modal">
  <h3>Add item</h3>
  <input id="aTitle" placeholder="Title">
  <input id="aLink" placeholder="Link / download URL">
  <input id="aImg" type="file" accept="image/*">
  <textarea id="aCopy" rows="4" placeholder="Text to copy (optional)"></textarea>
  <button class="mbtn" id="aSave">Publish</button>
  <button class="mbtn alt" data-close>Cancel</button>
</div></div>

<div class="ov" id="txov"><div class="modal" style="text-align:left"><h3 id="txt">Edit text</h3><textarea id="txa" rows="16" style="font-family:Consolas,monospace"></textarea><button class="mbtn" id="txok">Apply</button><button class="mbtn alt" data-close>Cancel</button></div></div>
<div class="toast" id="toast"></div>
<div id="cur"></div>

<script>
/* ============ CONFIG — edit these ============ */
const CONFIG = {
  discordInvite: "https://discord.gg/YOUR_INVITE",
  discordClientId: "",              // optional: add for real Discord OAuth (see README)
  sections: {
    apk:   { title:"Modding Tools", tabs:["Modded Apks","Libs","Meta Data Method"], cls:"apk" },
    unity: { title:"More Tools",      tabs:["Scripts","Projects","Packages"], cls:"unity-p" }
  }
};
/* ============================================= */

const $ = s => document.querySelector(s);
const load = (k,d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch { toast("Storage full — use smaller images") } };
let user = load("rcs_user", null);          // {name, staff, booster}
let items = [], lastIds = "";          // {id,section,tab,title,link,img,copy,ts}
let state = { page:"home", tab:{apk:0,unity:0}, q:"", sort:"new" };

function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",2200)}
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* splash */
let n=2; const w=$("#wait");
const iv=setInterval(()=>{n--; if(n>0){w.textContent=`Please wait ${n}s...`}else{clearInterval(iv);const s=$("#splash");s.style.opacity=0;setTimeout(()=>s.remove(),600);if(!user)open("#signin")}},1000);

/* custom cursor */
const cur=$("#cur");
addEventListener("mousemove",e=>{cur.style.left=e.clientX+"px";cur.style.top=e.clientY+"px"});
addEventListener("mousedown",()=>cur.classList.add("big"));
addEventListener("mouseup",()=>cur.classList.remove("big"));

function open(id){$(id).classList.add("open")}
function closeAll(){document.querySelectorAll(".ov").forEach(o=>o.classList.remove("open"))}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeAll);
document.querySelectorAll(".ov").forEach(o=>o.addEventListener("mousedown",e=>{if(e.target===o&&o.id!=="signin")closeAll()}));

/* header */
function renderHeader(){reg();
  const who=$("#who");
  who.innerHTML = user ? `<span class="av">${esc(user.name[0].toUpperCase())}</span>@${esc(user.name)}${user.staff?" 🛡️":""}${user.booster?" 💎":""}` : "Not signed in";
  document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));
}
who_click:{ $("#who").onclick=()=>{ if(!user) open("#signin") } }
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.q="";render();scrollTo(0,0)});
$("#burger").onclick=e=>{e.stopPropagation();$("#menu").classList.toggle("open")};
addEventListener("click",()=>$("#menu").classList.remove("open"));

/* sign in */
$("#cont").onclick=()=>{
  const v=$("#uname").value.trim().replace(/[^\w.-]/g,"");
  if(v.length<2) return toast("Pick a username (2+ characters)");
  user={name:v,staff:false,booster:false}; save("rcs_user",user); closeAll(); render(); toast("Signed in as @"+v);
};
$("#uname").addEventListener("keydown",e=>e.key==="Enter"&&$("#cont").click());
$("#discordLogin").onclick=()=>{
  if(!CONFIG.discordClientId){ toast("Discord login isn't set up yet — use a username for now"); return }
  const u=`https://discord.com/oauth2/authorize?client_id=${CONFIG.discordClientId}&response_type=token&scope=identify&redirect_uri=${encodeURIComponent(location.origin)}`;
  location.href=u;
};
/* Discord implicit-flow return */
(async()=>{
  const h=new URLSearchParams(location.hash.slice(1)); const t=h.get("access_token");
  if(!t) return;
  try{
    const r=await fetch("https://discord.com/api/users/@me",{headers:{Authorization:"Bearer "+t}});
    const d=await r.json(); user={name:d.global_name||d.username,staff:false,booster:false,discord:true};
    save("rcs_user",user); history.replaceState(null,"",location.pathname); render();
  }catch{ toast("Discord sign-in failed") }
})();

/* menu actions */
let codeMode="";
document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
  const a=b.dataset.act;
  if(a==="logout"){user=null;localStorage.removeItem("rcs_user");render();open("#signin");return}
  if(!user){open("#signin");return toast("Sign in first")}
  if(a==="rename"){const v=(prompt("New username:",user.name)||"").trim().replace(/[^\w.-]/g,"");if(v.length>=2){user.name=v;save("rcs_user",user);render()}return}
  codeMode=a;
  $("#codeTitle").textContent = a==="staff"?"Staff code":"Booster code";
  $("#codeHelp").textContent = a==="staff"?"Enter a staff code to add and remove items.":"Boost the Discord server to receive a booster code.";
  $("#codeIn").value=""; open("#codeov");
});
$("#codeOk").onclick=async()=>{
  const v=$("#codeIn").value.trim();if(!v)return;
  try{
    const r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:codeMode,code:v})});
    if(r.ok){user[codeMode==="staff"?"staff":"booster"]=true;if(codeMode==="staff")user.sc=v;save("rcs_user",user);closeAll();render();toast("Unlocked!")}
    else toast(r.status===503?"Server isn't set up yet (see setup)":"Invalid code, or too many tries. Wait 15 minutes.");
  }catch{toast("Couldn't reach the server")}
};
(async()=>{ // re-verify saved staff access on every visit
  if(!user?.staff)return;
  try{const r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:"staff",code:user.sc||""})});
    if(r.status===401){user.staff=false;delete user.sc;save("rcs_user",user);render()}}catch{}
})();

/* add item */
$("#aSave").onclick=async()=>{
  const sec=state.page, tab=CONFIG.sections[sec].tabs[state.tab[sec]];
  const title=$("#aTitle").value.trim(); if(!title) return toast("Add a title");
  let img=""; const f=$("#aImg").files[0];
  if(f){ img=await new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,480/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.7))};im.src=r.result};r.readAsDataURL(f)}) }
  try{
    const r=await fetch("/api/items",{method:"POST",headers:{"Content-Type":"application/json","x-staff-code":user.sc||""},body:JSON.stringify({section:sec,tab,title,link:$("#aLink").value.trim(),img,copy:$("#aCopy").value})});
    if(!r.ok){const d=await r.json().catch(()=>({}));return toast(r.status===503?"Database not connected (see setup)":r.status===401?"Staff code doesn't match STAFF_CODE in Vercel":(d.error||"Couldn't publish"))}
  }catch{return toast("Couldn't reach the server")}
  closeAll(); ["#aTitle","#aLink","#aCopy"].forEach(s=>$(s).value="");$("#aImg").value=""; await loadItems(true); toast("Published for everyone");
};

/* render */
function render(){
  renderHeader();
  const app=$("#app");
  $("#app").className="";
  if(state.page==="settings")return renderSettings();
  if(state.page==="meta")return renderMeta();
  if(state.page==="uabe")return renderUabe();
  if(state.page==="home"){
    app.innerHTML=`<h1>Welcome</h1>
    <p class="lead">Welcome to ZMH Modding Hub. Browse Modding Tools for modded APKs, libs and metadata methods, More Tools for scripts, projects and packages, and edit global-metadata.dat files right in your browser.</p>
    <div class="card-box"><h2>Join our Discord</h2><p>Connect with the community, get staff applications, or boost the server to unlock Booster codes.</p>
    <a class="dbtn" href="${esc(CONFIG.discordInvite)}" target="_blank" rel="noopener">Join Discord</a></div>`;
    return;
  }
  const sec=CONFIG.sections[state.page], ti=state.tab[state.page], tab=sec.tabs[ti];
  let list=items.filter(i=>i.section===state.page&&i.tab===tab&&i.title.toLowerCase().includes(state.q.toLowerCase()));
  list.sort((a,b)=>state.sort==="new"?b.ts-a.ts:state.sort==="old"?a.ts-b.ts:a.title.localeCompare(b.title));
  app.className=sec.cls;
  app.innerHTML=`<h1>${sec.title}</h1>
  <div class="layout"><div class="side">${sec.tabs.map((t,i)=>`<button class="tab ${i===ti?"on":""}" data-t="${i}">${t}</button>`).join("")}
  ${user?.staff?`<button class="tab" id="addBtn" style="margin-top:14px">+ Add item</button>`:""}</div>
  <div class="content"><div class="bar"><input id="q" placeholder="Search ${tab}..." value="${esc(state.q)}">
  <select id="sort"><option value="new">Newest</option><option value="old">Oldest</option><option value="az">A–Z</option></select>
  ${list.length?`<span class="count">${list.length} item${list.length>1?"s":""}</span>`:""}</div>
  ${list.length?`<div class="grid">${list.map(i=>`<div class="item" data-id="${i.id}"><div class="thumb">${i.img?`<img src="${i.img}" alt="">`:"📦"}</div><div class="t">${esc(i.title)}${user?.staff?` <a href="#" data-del="${i.id}" style="float:right;color:#ff6b6b;text-decoration:none">Remove</a>`:""}</div></div>`).join("")}</div>`:`<div class="empty">Nothing here yet.</div>`}
  </div></div>`;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{state.tab[state.page]=+b.dataset.t;state.q="";render()});
  const q=$("#q");q.oninput=()=>{state.q=q.value;const p=q.selectionStart;render();const nq=$("#q");nq.focus();nq.setSelectionRange(p,p)};
  const s=$("#sort");s.value=state.sort;s.onchange=()=>{state.sort=s.value;render()};
  const ab=$("#addBtn");if(ab)ab.onclick=()=>open("#addov");
  app.querySelectorAll("[data-del]").forEach(a=>a.onclick=e=>{e.preventDefault();e.stopPropagation();if(confirm("Delete this item?")){fetch("/api/items?id="+a.dataset.del,{method:"DELETE",headers:{"x-staff-code":user.sc||""}}).then(r=>{if(!r.ok)toast("Couldn't remove it");loadItems(true)})}});
  app.querySelectorAll(".item").forEach(c=>c.onclick=()=>{
    const it=items.find(x=>x.id==c.dataset.id);
    if(it.copy){navigator.clipboard?.writeText(it.copy).then(()=>toast("Copied to clipboard"))}
    if(it.link){window.open(it.link,"_blank","noopener")}
  });
}

  $("#cf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,128/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);save("rcs_cur_img",c.toDataURL("image/png"));applyCursor();toast("Mouse updated")};im.onerror=()=>toast("That image couldn't be read");im.src=r.result};r.readAsDataURL(f)};

async function loadUsers(){
  const box=$("#ulist");

    d.users.sort((a,b)=>b.last-a.last);
    box.innerHTML=`<p>${d.users.length} user${d.users.length==1?"":"s"}</p>`+d.users.map(u=>`<div class="urow"><span>@${esc(u.name)} · last seen ${new Date(u.last).toLocaleString()}</span><a href="#" data-u="${esc(u.name)}">Remove</a></div>`).join("");

}

/* ===== global-metadata.dat string literal editor ===== */
let M=null,edits=new Map(),outBuf=null,mq="",mp=0;const PG=100;
function parseMeta(buf){
  const dv=new DataView(buf);
  if(buf.byteLength<64||dv.getUint32(0,true)!==0xFAB11BAF) throw Error("Not a valid global-metadata.dat (wrong header, or the file is encrypted).");
  const ver=dv.getInt32(4,true),lo=dv.getUint32(8,true),ls=dv.getUint32(12,true),dO=dv.getUint32(16,true),dS=dv.getUint32(20,true);
  if(ver<16||ver>40||lo+ls>buf.byteLength||dO+dS>buf.byteLength) throw Error("Header looks corrupted or encrypted.");
  const td=new TextDecoder(),strs=[];
  for(let i=0;i<ls/8;i++){
    const len=dv.getUint32(lo+i*8,true),idx=dv.getUint32(lo+i*8+4,true);
    if(idx+len>dS) throw Error("String table is invalid — the file is probably encrypted.");
    strs.push(td.decode(new Uint8Array(buf,dO+idx,len)));
  }
  return {buf,ver,lo,dO,dS,hs:Math.min(lo,dO),strs};
}
function rebuild(){
  const m=M,enc=new TextEncoder(),src=new Uint8Array(m.buf),sdv=new DataView(m.buf),parts=[],ent=[];let pos=0;
  m.strs.forEach((_,i)=>{
    const b=edits.has(i)?enc.encode(edits.get(i)):src.subarray(m.dO+sdv.getUint32(m.lo+i*8+4,true),m.dO+sdv.getUint32(m.lo+i*8+4,true)+sdv.getUint32(m.lo+i*8,true));
    ent.push(b.length,pos);parts.push(b);pos+=b.length;
  });
  const nd=pos+(4-pos%4)%4,delta=nd-m.dS,end=m.dO+m.dS,out=new Uint8Array(m.buf.byteLength+delta);
  out.set(src.subarray(0,m.dO),0);let p=m.dO;parts.forEach(b=>{out.set(b,p);p+=b.length});
  out.set(src.subarray(end),m.dO+nd);
  const dv=new DataView(out.buffer);
  for(let k=2;k<m.hs/4;k+=2){const o=dv.getUint32(k*4,true);if(o>=end)dv.setUint32(k*4,o+delta,true)}
  dv.setUint32(20,nd,true);
  const to=m.lo>=end?m.lo+delta:m.lo;
  ent.forEach((v,i)=>dv.setUint32(to+i*4,v,true));
  return out;
}
function renderMeta(){
  $("#app").innerHTML=`<h1>Metadata Editor</h1><p class="lead" style="font-size:1.05rem">Open a global-metadata.dat file, edit its string literals, click Save, then Download Modified Metadata. Everything runs in your browser and the file is never uploaded.</p><div class="bar" style="margin:20px 0"><input type="file" id="mf"><button class="btn" id="msave">Save</button><button class="btn" id="mdl" disabled>Download Modified Metadata</button></div><div id="mbody"></div>`;
  $("#mf").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{M=parseMeta(await f.arrayBuffer());edits.clear();outBuf=null;mq="";mp=0;$("#mdl").disabled=true;metaBody();toast("Loaded "+M.strs.length+" strings")}catch(x){M=null;$("#mbody").innerHTML=`<div class="empty">${esc(x.message)}</div>`}};
  $("#msave").onclick=()=>{if(!M)return toast("Open a file first");try{outBuf=rebuild();$("#mdl").disabled=false;toast("Saved "+edits.size+" edit"+(edits.size==1?"":"s"))}catch(x){toast("Save failed: "+x.message)}};
  $("#mdl").onclick=()=>{if(!outBuf)return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([outBuf],{type:"application/octet-stream"}));a.download="global-metadata.dat";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
  if(M){$("#mdl").disabled=!outBuf;metaBody()}
}
const fit=t=>{t.style.height="auto";t.style.height=(t.scrollHeight+2)+"px"};
addEventListener("resize",()=>document.querySelectorAll(".mrow textarea").forEach(fit));
function metaBody(){
  const q=mq.toLowerCase(),ids=[];
  M.strs.forEach((s,i)=>{if(!q||(edits.get(i)??s).toLowerCase().includes(q))ids.push(i)});
  const pages=Math.max(1,Math.ceil(ids.length/PG));mp=Math.min(mp,pages-1);
  $("#mbody").innerHTML=`<div class="bar"><input id="mq" placeholder="Search ${M.strs.length} strings..." value="${esc(mq)}"><button class="btn" id="mprev">Prev</button><span class="count">Page ${mp+1} / ${pages}</span><button class="btn" id="mnext">Next</button></div><p class="count" style="margin:10px 0">Metadata version ${M.ver}: ${ids.length} shown, ${edits.size} edited</p><div id="mrows"></div>`;
  const inp=$("#mq");inp.oninput=()=>{mq=inp.value;mp=0;const c=inp.selectionStart;metaBody();const n=$("#mq");n.focus();n.setSelectionRange(c,c)};
  $("#mprev").onclick=()=>{if(mp>0){mp--;metaBody()}};$("#mnext").onclick=()=>{if(mp<pages-1){mp++;metaBody()}};
  const rows=$("#mrows");
  ids.slice(mp*PG,mp*PG+PG).forEach(i=>{
    const r=document.createElement("div");r.className="mrow";
    const n=document.createElement("span");n.textContent="#"+i;
    const t=document.createElement("textarea");t.rows=1;t.value=edits.get(i)??M.strs[i];t.classList.toggle("ch",edits.has(i));
    t.oninput=()=>{fit(t);if(t.value===M.strs[i])edits.delete(i);else edits.set(i,t.value);t.classList.toggle("ch",edits.has(i));outBuf=null;$("#mdl").disabled=true};
    r.append(n,t);rows.append(r);fit(t);
  });
}

async function loadItems(force){
  try{
    const r=await fetch("/api/items",{cache:"no-store"});if(!r.ok)return;
    const d=await r.json(),ids=JSON.stringify(d.items.map(i=>i.id));items=d.items;
    if((force||ids!==lastIds)&&["apk","unity"].includes(state.page)&&!document.activeElement.matches("input,textarea,select"))render();
    lastIds=ids;
  }catch{}
}
loadItems();setInterval(loadItems,30000);
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>loadItems(true)));
render();
